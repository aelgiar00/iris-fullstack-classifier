services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: iris
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d iris"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./api
    ports:
      - "8000:8000"
    env_file:
      - ./api/.env
    depends_on:
      db:
        condition: service_healthy

  ui:
    build:
      context: ./ui
    ports:
      - "8501:8501"
    depends_on:
      api:
        condition: service_started

volumes:
  pgdata: